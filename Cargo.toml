[package]
name = "ArchiveUtils"
version = "0.1.0"
edition = "2021"

[lib]
name = "ArchiveUtils"
path = "src/lib.rs"

[[bin]]
name = "ArchiveUtils"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
unrar = { version = "0.5", optional = true }
zstd = "0.13"
lz4 = "1.28"
md5 = "0.8.0"
alphanumeric-sort = "1.5"
rfd = { version = "0.14", optional = true }
egui = { version = "0.34.2", optional = true }
eframe = { version = "0.34.2", default-features = false, optional = true, features = ["glow", "default_fonts"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif", "bmp"] }
ffmpeg-next = { git = "https://github.com/zmwangx/rust-ffmpeg", branch = "master", optional = true, features = ["format"] }
cpal = { version = "0.15", optional = true }
aes-gcm = "0.10.3"
rand = "0.10.1"
sevenz-rust = "0.6.1"

[features]
default = ["gui", "unrar", "ffmpeg"]
gui = ["dep:egui", "dep:eframe", "dep:rfd"]
ffmpeg = ["dep:ffmpeg-next", "dep:cpal"]
unrar = ["dep:unrar"]

[dev-dependencies]
tempfile = "3.14"
